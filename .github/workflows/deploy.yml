name: Publicar en Needle Cloud
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serializa despliegues para que una versión anterior no sustituya a la nueva.
concurrency:
  group: needle-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Optimizar build con Needle
        run: npm run build
        env:
          NEEDLE_CLOUD_TOKEN: ${{ secrets.NEEDLE_CLOUD_TOKEN }}
      - uses: needle-tools/deploy-to-needle-cloud-action@v1
        with:
          token: ${{ secrets.NEEDLE_CLOUD_TOKEN }}
          dir: ./web/dist
          name: rebote-de-cristal
